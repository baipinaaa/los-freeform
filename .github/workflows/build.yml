name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build LOSFreeform APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Build with Gradle (auto-retry on network flake)
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do
            echo "=== Gradle build attempt $i/4 ==="
            if ./gradlew --no-daemon assembleRelease assembleDebug; then
              echo "BUILD_OK"
              exit 0
            fi
            echo "Build failed (likely dependency download flake), waiting 60s before retry..."
            sleep 60
          done
          echo "BUILD_FAILED after 4 attempts"
          exit 1

      - name: Compute Version
        id: version
        run: echo "ver=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: losfreeform-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    # 每次 push main / 手动触发都自动发布 Release（PR 不发布）
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version
        id: version
        run: echo "ver=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: losfreeform-apk
          path: apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: LOSFreeform v${{ steps.version.outputs.ver }}
          body: |
            自动构建发布（版本号 = Git 提交数）。

            安装：解压 apk zip 后安装 `app-release.apk`（或 app-debug.apk），然后在 LSPosed 中启用模块并重启手机。
          files: |
            apk/release/*.apk
            apk/debug/*.apk
          generate_release_notes: true