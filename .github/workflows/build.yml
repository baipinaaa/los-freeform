name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '手动编译后是否发布 GitHub Release (true=发布, false=只编译拿APK)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build LOSFreeform APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-deps

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Upload APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: losfreeform-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    # push main 自动发布；手动触发时按 publish_release 输入决定；PR 不发布
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version
        id: version
        run: echo "ver=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Tag Exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.ver }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: losfreeform-apk
          path: apk

      - name: Create Release
        # tag 已存在（例如手动重跑同一提交）则跳过，避免 tag 冲突失败
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          name: LOSFreeform v${{ steps.version.outputs.ver }}
          body: |
            自动构建发布（版本号 = Git 提交数）。

            安装：解压 apk zip 后安装 `app-release.apk`（或 app-debug.apk），然后在 LSPosed 中启用模块并重启手机。
          files: |
            apk/release/*.apk
            apk/debug/*.apk
          generate_release_notes: true